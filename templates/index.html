<style>
:root {
  --accent: #0a6fc2;
  --accent-hover: #085a9f;
  --accent-soft: #eaf2fb;
  --on-accent: #ffffff;
  --bg: #fafafa;
  --glow: transparent;
  --surface: #ffffff;
  --text: #1c1c1e;
  --muted: #6e6e73;
  --border: #e5e5e8;
  --user-bg: #efeff1;
  --code-bg: #16181d;
  --shadow: 0 2px 14px rgba(0, 0, 0, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --accent: #4aa3ff;
    --accent-hover: #7bbcff;
    --accent-soft: #1b2635;
    --on-accent: #0a0a0b;
    --bg: #141415;
    --glow: transparent;
    --surface: #1d1d1f;
    --text: #ececee;
    --muted: #9b9ba2;
    --border: #2c2c2f;
    --user-bg: #2a2a2d;
    --code-bg: #0d0d0e;
    --shadow: 0 2px 14px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: radial-gradient(1100px 560px at 100% -8%, var(--glow), transparent 62%), var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(8px);
}
.marca { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: .2px; }
.marca svg { width: 34px; height: 34px; }
.btn-nuevo {
  background: transparent; color: var(--text); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer;
}
.btn-nuevo:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
.col { max-width: 760px; margin: 0 auto; padding: 24px 20px 12px; }

/* Pantalla de bienvenida */
#bienvenida { text-align: center; padding: 9vh 0 3vh; }
#bienvenida svg { width: 150px; height: 150px; filter: drop-shadow(0 8px 22px rgba(0, 0, 0, .22)); }
#bienvenida h1 {
  font-family: ui-serif, Georgia, "Times New Roman", serif;
  font-weight: 500; font-size: clamp(28px, 5vw, 38px); margin-top: 18px;
}
#bienvenida p { color: var(--muted); margin-top: 8px; }
.sugerencias { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 28px; }
.sugerencias button {
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 999px; padding: 9px 16px; font-size: 14px; cursor: pointer;
}
.sugerencias button:hover { border-color: var(--accent); color: var(--accent); }

/* Mensajes */
.msg { display: flex; gap: 14px; margin: 22px 0; animation: sube .25s ease; }
@keyframes sube { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.msg.user { justify-content: flex-end; }
.msg.user .cuerpo {
  background: var(--user-bg); border-radius: 18px 18px 4px 18px;
  padding: 12px 16px; max-width: 85%; white-space: pre-wrap; word-break: break-word;
}
.avatar { flex: none; width: 30px; height: 30px; margin-top: 2px; }
#espaciador { flex: none; pointer-events: none; }
.wordmark { display:flex; align-items:center; justify-content:center; gap:14px; margin:4px 0 14px; padding-left:.5em; letter-spacing:.5em; font-size:15px; font-weight:500; color:var(--text); }
.wordmark::before, .wordmark::after { content:""; width:34px; height:1px; background:var(--border); }
.archivo-card { margin-top:12px; }
.archivo-card .archivo-listo { margin-top:0; flex-wrap:wrap; }
.archivo-card .archivo-listo .meta { flex:1 1 150px; min-width:0; }
.archivo-card .archivo-listo .meta b { display:block; white-space:normal; overflow:visible; text-overflow:clip; overflow-wrap:anywhere; }
.archivo-listo .ver { border:1px solid var(--border); background:transparent; color:var(--text); border-radius:9px; padding:7px 10px; cursor:pointer; font-size:13px; }
.vista-archivo { display:none; margin-top:8px; max-height:340px; overflow:auto; border:1px solid var(--border); border-radius:12px; padding:12px; background:var(--surface); font-size:13.5px; }
.vista-archivo.abierta { display:block; }
.vista-archivo pre { margin:0; }
.nota-bot { color:var(--muted); font-size:12px; margin-top:8px; }
header { display:flex; align-items:center; gap:6px; }
header .marca { font-weight:650; font-size:17px; display:flex; align-items:center; gap:9px; }
.hbtn { flex:none; width:40px; height:40px; border:0; background:transparent; color:var(--text); border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.hbtn:hover { background:var(--user-bg); }
.hbtn svg { width:22px; height:22px; }
.marca svg { width:30px; height:30px; flex:none; }
#drawerOverlay { position:fixed; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .22s; z-index:59; }
#drawer { position:fixed; top:0; left:0; bottom:0; width:min(84vw,330px); background:var(--bg); border-right:1px solid var(--border); transform:translateX(-102%); transition:transform .24s ease; z-index:60; display:flex; flex-direction:column; padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px)); }
body.drawer-open #drawer { transform:none; box-shadow:0 0 40px rgba(0,0,0,.35); }
body.drawer-open #drawerOverlay { opacity:1; pointer-events:auto; }
.dr-top { display:flex; align-items:center; justify-content:space-between; padding:2px 4px 14px 8px; }
.dr-brand { display:flex; align-items:center; gap:10px; font-weight:650; font-size:19px; }
.dr-brand svg { width:32px; height:32px; }
.dr-item { display:flex; align-items:center; gap:12px; width:100%; padding:11px 10px; border:0; background:transparent; color:var(--text); font-size:16px; border-radius:10px; cursor:pointer; text-align:left; }
.dr-item:hover { background:var(--user-bg); }
.dr-item svg { width:20px; height:20px; flex:none; color:var(--muted); }
.dr-sec { display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:13px; padding:16px 10px 6px; }
.dr-sec button { border:0; background:transparent; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline; }
#drawerLista { flex:1; overflow-y:auto; margin:0 -4px; padding:0 4px; }
.dr-conv { display:flex; align-items:center; gap:2px; border-radius:10px; }
.dr-conv:hover, .dr-conv.activa { background:var(--user-bg); }
.dr-conv .tit { flex:1; min-width:0; padding:11px 10px; border:0; background:transparent; color:var(--text); font-size:15px; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
.dr-conv .del { flex:none; width:38px; height:38px; border:0; background:transparent; color:var(--muted); border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.dr-conv .del svg { width:17px; height:17px; }
.dr-conv .del:hover { color:#d92d20; }
.dr-vacio { color:var(--muted); font-size:14px; padding:10px; }
.dr-bottom { padding-top:10px; }
.dr-nuevo { width:100%; padding:13px; border:0; border-radius:999px; background:var(--text); color:var(--bg); font-size:16px; font-weight:600; cursor:pointer; }
.dr-pie { text-align:center; color:var(--muted); font-size:11px; padding-top:8px; min-height:16px; }
.icono.activo { background:var(--accent-soft); color:var(--accent); }
.img-generada { display:block; max-width:100%; width:min(100%,420px); border-radius:14px; border:1px solid var(--border); }
.img-acciones { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.btn-acc, .btn-sec { border-radius:9px; padding:8px 12px; cursor:pointer; font-size:13.5px; }
.btn-acc { border:0; background:var(--accent); color:var(--on-accent); font-weight:600; }
.btn-sec { border:1px solid var(--border); background:transparent; color:var(--text); }
header .marca { white-space: nowrap; min-width: 0; flex: 1 1 0; overflow: hidden; }
.acciones { flex: none; }
.marca svg { flex: none; }
.btn-nuevo { white-space: nowrap; }
@media (max-width: 480px) {
  header { padding: 10px 12px; gap: 6px; }
  .marca { gap: 8px; font-size: 16px; }
  #storageBadge { font-size: 10px !important; }
  .btn-nuevo { padding: 7px 9px; font-size: 13px; border-radius: 9px; }
  header > div:last-child { gap: 5px !important; }
}
@media (max-width: 440px) { #storageBadge { display: none; } }
@media (max-width: 560px) { .btn-nuevo .tx { display: none; } .btn-nuevo { padding: 8px 13px; font-size: 17px; line-height: 1; } }
.cuerpo pre { padding-top: 50px; }
.vista-archivo pre { padding-top: 16px; }
.msg.bot .cuerpo { flex: 1; min-width: 0; line-height: 1.7; }
.cuerpo p { margin: 0 0 12px; }
.cuerpo p:last-child { margin-bottom: 0; }
.cuerpo ul, .cuerpo ol { margin: 0 0 12px 22px; }
.cuerpo li { margin: 4px 0; }
.cuerpo h1, .cuerpo h2, .cuerpo h3 { margin: 18px 0 8px; line-height: 1.3; }
.cuerpo a { color: var(--accent); }
.cuerpo code { background: var(--accent-soft); padding: 2px 6px; border-radius: 6px; font-size: .9em; }
.cuerpo pre {
  position: relative; background: var(--code-bg); color: #e6e9f2; border-radius: 12px;
  padding: 16px; overflow-x: auto; margin: 0 0 12px; font-size: 13.5px; line-height: 1.55;
}
.cuerpo pre code { background: none; padding: 0; color: inherit; }
.copiar {
  position: absolute; top: 8px; right: 8px; background: #2a2d33; color: #e6e8ec;
  border: 0; border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer;
}
.copiar:hover { background: var(--accent); color: var(--on-accent); }
.cuerpo table { border-collapse: collapse; margin: 0 0 12px; display: block; overflow-x: auto; }
.cuerpo th, .cuerpo td { border: 1px solid var(--border); padding: 7px 12px; }
.cuerpo th { background: var(--accent-soft); }
.cuerpo blockquote { border-left: 3px solid var(--accent); padding-left: 14px; color: var(--muted); margin: 0 0 12px; }
.error { color: #d92d20; }

.adjuntos-msg { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; justify-content: flex-end; }
.adjuntos-msg img { max-height: 140px; max-width: 220px; border-radius: 12px; object-fit: cover; }

.puntos { display: inline-flex; gap: 5px; padding: 10px 0; }
.puntos i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: rebote 1.1s infinite; }
.puntos i:nth-child(2) { animation-delay: .15s; }
.puntos i:nth-child(3) { animation-delay: .3s; }
@keyframes rebote { 0%, 60%, 100% { opacity: .25; transform: none; } 30% { opacity: 1; transform: translateY(-4px); } }

/* Barra de escritura */
footer { padding: 0 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.caja {
  max-width: 760px; margin: 0 auto; background: var(--surface);
  border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow);
  padding: 10px 10px 10px 12px; transition: border-color .15s, box-shadow .15s;
}
.caja:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent), var(--shadow); }
.caja.arrastrando { border-color: var(--accent); background: var(--accent-soft); }
#previas { display:flex; flex-wrap:wrap; gap:10px; padding:4px 2px 10px; max-height:210px; overflow:auto; }
#previas:empty { display:none; }
.previa { position:relative; width:112px; min-height:94px; border:1px solid var(--border); background:var(--surface); border-radius:14px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.previa.imagen { width:112px; height:112px; }
.previa .miniatura { width:100%; height:72px; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); overflow:hidden; }
.previa.imagen .miniatura { height:100%; }
.previa img { width:100%; height:100%; object-fit:cover; cursor:zoom-in; }
.previa .archivo-icono { font-size:31px; }
.previa .nombre { display:block; padding:6px 24px 6px 8px; font-size:11px; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.previa .tipo { display:block; padding:0 8px 7px; color:var(--muted); font-size:10px; }
.previa .quitar { position:absolute; top:5px; right:5px; width:24px; height:24px; border:0; border-radius:50%; background:rgba(20,20,25,.72); color:#fff; cursor:pointer; font-size:15px; line-height:24px; padding:0; z-index:3; }
.previa .quitar:hover { background:#d92d20; }
.adjuntos-contador { width:100%; color:var(--muted); font-size:11px; padding:0 3px 2px; }
.archivo-listo { display:flex; align-items:center; gap:10px; padding:10px 12px; margin-top:8px; border:1px solid var(--border); border-radius:12px; background:var(--accent-soft); }
.archivo-listo .descarga-icon { font-size:24px; }
.archivo-listo .meta { flex:1; min-width:0; }
.archivo-listo .meta b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.archivo-listo .meta small { color:var(--muted); }
.archivo-listo .descargar { border:0; border-radius:9px; padding:7px 10px; background:var(--accent); color:var(--on-accent); cursor:pointer; font-weight:600; }
.archivo-listo .descargar:hover { filter:brightness(.94); }
.fila { display: flex; align-items: flex-end; gap: 6px; }
.copiar.bajar { right: 70px; }
.tarjeta-adj { display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px 12px; text-align:left; max-width:260px; }
.tarjeta-adj .ic { font-size:24px; }
.tarjeta-adj .nm { display:block; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px; }
.tarjeta-adj small { color:var(--muted); font-size:11px; }
.previa.subiendo { display:flex; align-items:center; justify-content:center; min-height:94px; color:var(--muted); font-size:11px; padding:8px; text-align:center; }
textarea {
  flex: 1; background: transparent; border: 0; outline: 0; resize: none; color: var(--text);
  font: inherit; font-size: 16px; line-height: 1.5; max-height: 200px; padding: 8px 4px;
}
textarea::placeholder { color: var(--muted); }
.icono {
  flex: none; width: 38px; height: 38px; border-radius: 12px; border: 0; cursor: pointer;
  display: grid; place-items: center; background: transparent; color: var(--muted);
}
.icono:hover { background: var(--accent-soft); color: var(--accent); }
.icono svg { width: 20px; height: 20px; }
#enviar { background: var(--accent); color: var(--on-accent); border-radius: 50%; }
#enviar:hover { background: var(--accent-hover); color: var(--on-accent); }
#enviar:disabled { opacity: .4; cursor: not-allowed; }
.pie { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }

.panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;padding:20px}.panel.show{display:block}.panel-box{max-width:720px;max-height:80vh;overflow:auto;margin:7vh auto;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel-head button{border:0;background:transparent;color:var(--text);font-size:25px;cursor:pointer}.conv-item,.mem-item{padding:11px;border:1px solid var(--border);border-radius:12px;margin:8px 0;cursor:pointer}.conv-item:hover{border-color:var(--accent)}.mem-item{display:flex;justify-content:space-between;gap:10px;cursor:default}.small-btn{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:8px;padding:5px 8px;cursor:pointer}.exportes{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.exportes button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:12px}.exportes button:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>

<!-- Logo reutilizable -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d8bff"/>
      <stop offset="1" stop-color="#0a3fe0"/>
    </linearGradient>

function initTampy(){
  chat=$('chat'); scroll=$('scroll'); texto=$('texto'); btnEnviar=$('enviar'); previas=$('previas'); caja=$('caja'); inputArchivo=$('archivo');
  if(!chat || !scroll || !texto || !btnEnviar){ console.error('TAMPY: faltan elementos del chat'); return; }

function logoHTML(){return '<svg class="avatar"><use href="#logo"></use></svg>'}

function renderMarkdown(md){
  if(window.marked && window.DOMPurify){
    const html=DOMPurify.sanitize(marked.parse(md,{breaks:true}));
    const cont=document.createElement('div');cont.innerHTML=html;
    cont.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});
    cont.querySelectorAll('pre').forEach(pre=>{const cod=pre.querySelector('code');const b=document.createElement('button');b.type='button';b.className='copiar';b.textContent='Copiar';b.onclick=()=>{navigator.clipboard?.writeText((cod||pre).textContent.trim());b.textContent='¡Copiado!';setTimeout(()=>b.textContent='Copiar',1500)};pre.appendChild(b);const d=document.createElement('button');d.type='button';d.className='copiar bajar';d.textContent='⬇ Descargar';d.onclick=()=>{const i=infoCodigo(cod);descargarBlob(new Blob([(cod||pre).textContent]),i.nombre,false)};pre.appendChild(d)});return cont;
  }
  const cont=document.createElement('div');cont.style.whiteSpace='pre-wrap';cont.textContent=md;return cont;
}
const EXT_LANG={html:'html',xml:'xml',css:'css',javascript:'js',js:'js',typescript:'ts',ts:'ts',python:'py',py:'py',json:'json',csv:'csv',sql:'sql',bash:'sh',sh:'sh',shell:'sh',yaml:'yaml',yml:'yml',markdown:'md',md:'md',java:'java',c:'c',cpp:'cpp',csharp:'cs',cs:'cs',php:'php',ruby:'rb',go:'go',rust:'rs',text:'txt',txt:'txt',plaintext:'txt'};
function infoCodigo(cod){
  const cls=[...(cod&&cod.classList||[])].find(c=>c.startsWith('language-'));const lang=cls?cls.slice(9):'';
  if(lang.toLowerCase().startsWith('archivo:')){const n=lang.slice(8).replace(/[^\w.\-]/g,'_');if(n)return {nombre:n}}
  const cont=(cod&&cod.textContent)||'';
  let ext=EXT_LANG[lang.toLowerCase()];
  if(!ext&&/^\s*(<!doctype html|<html)/i.test(cont))ext='html';
  return {nombre:nombreAuto(ext||'txt',cont)};
}
function nombreAuto(ext,cont){
  const slug=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40);
  let base='';
  if(ext==='html'){const m=cont.match(/<title[^>]*>([^<]{1,80})<\/title>/i);base=slug(m&&m[1])||slug((cont.match(/<h1[^>]*>([^<]{1,60})<\/h1>/i)||[])[1])}
  else if(ext==='py'&&/Flask\(/.test(cont))base='app';
  if(!base){const d=new Date(),p=n=>String(n).padStart(2,'0');base=({html:'pagina',py:'script',js:'script',css:'estilos',json:'datos',csv:'datos',sql:'consulta'}[ext]||'archivo')+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())}
  return base+'.'+ext;
}
function quitarBienvenida(){const b=$('bienvenida');if(b)b.remove()}
function agregarUsuario(t,adj){quitarBienvenida();const div=document.createElement('div');div.className='msg user';const c=document.createElement('div');c.className='cuerpo';if(adj.length){const f=document.createElement('div');f.className='adjuntos-msg';adj.forEach(a=>{if(a.tipo==='imagen'){const im=document.createElement('img');im.src=a.dataUrl;f.appendChild(im)}else{const x=document.createElement('div');x.className='tarjeta-adj';x.innerHTML='<span class="ic">'+iconoArchivo(a.nombre)+'</span><div><span class="nm">'+esc(a.nombre)+'</span><small>'+esc((a.analisis&&a.analisis.tipo||a.nombre.split('.').pop()||'archivo').toUpperCase()+(a.size?' • '+formatoBytes(a.size):''))+'</small></div>';f.appendChild(x)}});c.appendChild(f)}if(t)c.appendChild(document.createTextNode(t));div.appendChild(c);insertar(div);bajar();return div}
function agregarBot(contenido,esError=false){const div=document.createElement('div');div.className='msg bot';div.innerHTML=logoHTML();const c=document.createElement('div');c.className='cuerpo'+(esError?' error':'');if(esError)c.textContent=contenido;else rellenarBot(c,contenido);div.appendChild(c);insertar(div);bajar();return div}
function agregarEscribiendo(){const d=document.createElement('div');d.className='msg bot';d.innerHTML=logoHTML()+'<div class="cuerpo"><span class="puntos"><i></i><i></i><i></i></span></div>';insertar(d);bajar();return d}
async function api(url,opt={}){opt.headers=Object.assign({},opt.headers||{});try{const clave=sessionStorage.getItem('tampy_clave');if(clave)opt.headers['X-Clave']=clave}catch(e){}let r=await fetch(url,opt);if(r.status===401&&REQUIERE_CLAVE){const n=prompt('Clave de acceso de TAMPY:');if(!n)return r;sessionStorage.setItem('tampy_clave',n);opt.headers['X-Clave']=n;r=await fetch(url,opt)}return r}
function profileHeader(){let p='public';try{p=localStorage.getItem('tampy_profile')||p}catch(e){}return {'X-Tampy-Profile':p}}
function redimensionarImagen(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const M=1568,s=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85))};im.onerror=()=>rej(new Error('No pude abrir '+file.name));im.src=u})}
async function procesarArchivos(lista){for(const file of lista){if(pendientes.length>=10){alert('Máximo 10 archivos o imágenes por mensaje.');break}try{if(file.type.startsWith('image/')){pendientes.push({tipo:'imagen',nombre:file.name||'imagen.jpg',size:file.size,dataUrl:await redimensionarImagen(file)})}else{subiendo.push(file.name);pintarPrevias();const fd=new FormData();fd.append('archivo',file);let r,d;try{r=await api('/api/archivo',{method:'POST',body:fd});try{d=await r.json()}catch(_){d={error:r.status===413?'El archivo supera el límite de 100 MB.':'El servidor no pudo procesar el archivo (HTTP '+r.status+'). En Render gratis suele ser por tamaño o por tiempo de espera.'}}}finally{subiendo.splice(subiendo.indexOf(file.name),1)}if(!r.ok)throw new Error(d.error);pendientes.push({tipo:'archivo',id:d.id,nombre:d.nombre,size:file.size,texto:d.texto,truncado:d.truncado,analisis:d.analisis})}}catch(e){alert(e.message)}}pintarPrevias()}
function iconoArchivo(nombre){const e=(nombre.split('.').pop()||'').toLowerCase();return ({xlsx:'📊',xlsm:'📊',xls:'📊',csv:'📊',pdf:'📕',docx:'📘',pptx:'📙',txt:'📄',md:'📝',json:'🧾',js:'🟨',py:'🐍',html:'🌐',css:'🎨'}[e]||'📎')}
function formatoBytes(n){if(!n)return '';if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
function pintarPrevias(){
  previas.innerHTML='';
  subiendo.forEach(n=>{const u=document.createElement('div');u.className='previa subiendo';u.textContent='⏳ Subiendo '+n+'...';previas.appendChild(u)});
  if(!pendientes.length)return;
  const contador=document.createElement('div');contador.className='adjuntos-contador';contador.textContent=`${pendientes.length} archivo${pendientes.length===1?'':'s'} preparado${pendientes.length===1?'':'s'} para enviar`;previas.appendChild(contador);
  pendientes.forEach((a,i)=>{
    const c=document.createElement('div');c.className='previa '+(a.tipo==='imagen'?'imagen':'archivo');
    const q=document.createElement('button');q.type='button';q.className='quitar';q.title='Quitar';q.textContent='×';q.onclick=()=>{pendientes.splice(i,1);pintarPrevias()};c.appendChild(q);
    const m=document.createElement('div');m.className='miniatura';
    if(a.tipo==='imagen'){const im=document.createElement('img');im.src=a.dataUrl;im.alt=a.nombre;im.title='Ver imagen';im.onclick=()=>abrirImagenPrevia(a.dataUrl,a.nombre);m.appendChild(im)}
    else {const ic=document.createElement('span');ic.className='archivo-icono';ic.textContent=iconoArchivo(a.nombre);m.appendChild(ic)}
    c.appendChild(m);
    const n=document.createElement('span');n.className='nombre';n.title=a.nombre;n.textContent=a.nombre;c.appendChild(n);
    if(a.tipo==='archivo'){const t=document.createElement('span');t.className='tipo';t.textContent=(a.analisis?.tipo||a.nombre.split('.').pop()||'archivo').toUpperCase()+(a.size?' • '+formatoBytes(a.size):'');c.appendChild(t)}
    previas.appendChild(c);
  });
}
function abrirImagenPrevia(src,nombre){
  let modal=document.getElementById('modalImagenTampy');
  if(!modal){modal=document.createElement('div');modal.id='modalImagenTampy';modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;cursor:zoom-out';modal.onclick=()=>modal.remove();document.body.appendChild(modal)}
  modal.innerHTML=`<img src="${src}" alt="${esc(nombre)}" style="max-width:96vw;max-height:90vh;border-radius:16px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.4)">`;
}
// ================= Archivos entregados como tarjetas (detección automática) =================
const EXT_BIN={xlsx:1,docx:1,pdf:1,pptx:1};
const MIME_EXT={html:'text/html',htm:'text/html',json:'application/json',csv:'text/csv',css:'text/css',js:'text/javascript',xml:'application/xml',md:'text/markdown',svg:'image/svg+xml'};
function nombreSeguro(n){n=String(n||'archivo.txt').trim().replace(/[\\/:*?"<>|\n\r]+/g,'_').slice(0,80);if(!/\.[A-Za-z0-9]{1,6}$/.test(n))n+='.txt';return n}
function extraerArchivos(md){
  const archivos=[];
  const texto=String(md).replace(/```archivo:\s*([^\s`]+)[^\n]*\n([\s\S]*?)(```|$)/g,(m,nombre,cont,cierre)=>{archivos.push({nombre:nombreSeguro(nombre),contenido:cont.replace(/\n$/,''),completo:cierre==='```'});return '\n'});
  return {texto:texto.trim(),archivos};
}
function rellenarBot(c,contenido){
  const mi=String(contenido).match(/^\[\[imagen:([\s\S]*)\]\]$/);if(mi){c.appendChild(tarjetaImagenGuardada(mi[1]));return}
  const {texto,archivos}=extraerArchivos(contenido);
  if(texto||!archivos.length)c.appendChild(renderMarkdown(texto||contenido));
  archivos.forEach(a=>c.appendChild(tarjetaArchivo(a)));
}
function tarjetaArchivo(a){
  const ext=(a.nombre.split('.').pop()||'').toLowerCase();
  const wrap=document.createElement('div');wrap.className='archivo-card';
  const card=document.createElement('div');card.className='archivo-listo';
  const tam=formatoBytes(new Blob([a.contenido]).size);
  card.innerHTML='<span class="descarga-icon">'+iconoArchivo(a.nombre)+'</span><div class="meta"><b>'+esc(a.nombre)+'</b><small>'+esc(ext.toUpperCase()+(tam&&!EXT_BIN[ext]?' • '+tam:'')+(a.completo?' • listo para descargar':' • ⚠ respuesta cortada, puede estar incompleto'))+'</small></div>';
  const vista=document.createElement('div');vista.className='vista-archivo';
  const ver=document.createElement('button');ver.type='button';ver.className='ver';ver.textContent='👁 Ver';
  ver.onclick=()=>{
    if(!vista.firstChild){
      if(EXT_BIN[ext]||ext==='md')vista.appendChild(renderMarkdown(a.contenido));
      else{const pre=document.createElement('pre');const code=document.createElement('code');code.textContent=a.contenido;pre.appendChild(code);vista.appendChild(pre)}
    }
    const abre=vista.classList.toggle('abierta');ver.textContent=abre?'Ocultar':'👁 Ver';ajustarEspaciador(anclaEl);
  };
  const btnBajar=document.createElement('button');btnBajar.type='button';btnBajar.className='descargar';btnBajar.textContent='⬇ Descargar';
  btnBajar.onclick=()=>bajarArchivo(a,btnBajar);
  card.appendChild(ver);card.appendChild(btnBajar);wrap.appendChild(card);wrap.appendChild(vista);return wrap;
}
async function bajarArchivo(a,btn){
  const ext=(a.nombre.split('.').pop()||'').toLowerCase();const t=btn.textContent;
  try{
    let blob;
    if(EXT_BIN[ext]){
      btn.disabled=true;btn.textContent='Generando…';
      const r=await api('/api/export',{method:'POST',headers:{'Content-Type':'application/json',...profileHeader()},body:JSON.stringify({text:a.contenido,format:ext,name:a.nombre.replace(/\.[^.]+$/,'')})});
      if(!r.ok)throw new Error(await leerError(r,'No se pudo generar el archivo'));
      blob=await r.blob();
    }else blob=new Blob([a.contenido],{type:'application/octet-stream'});
    descargarBlob(blob,a.nombre,false);
  }catch(e){alert(a.nombre+': '+e.message)}
  finally{btn.disabled=false;btn.textContent=t}
}
// Si el modelo no usó el formato de archivo pero el usuario pidió uno claramente, se arma la tarjeta igual
const FMT_DOC={xlsx:/\b(excel|xlsx|hoja de c[aá]lculo|planilla)\b/,docx:/\b(word|docx)\b/,pdf:/\bpdf\b/,pptx:/\b(powerpoint|pptx|presentaci[oó]n|diapositivas)\b/,html:/\bhtml\b/};
const FMT_COD={py:/\b(python|py)\b/,js:/\b(javascript|js)\b/,css:/\bcss\b/,json:/\bjson\b/,sql:/\bsql\b/,csv:/\bcsv\b/};
function formatoPedido(t,files){
  t=(t||'').toLowerCase();
  if(!/\b(dame|d[aá]me|genera|gen[eé]ra(me)?|crea|cr[eé]a(me)?|haz(me)?|prepara(me)?|exporta(lo|la|me)?|p[aá]sa(lo|la|me)?|convierte(lo|la|me)?|entr[eé]ga(me)?|env[ií]a(me)?|m[aá]nda(me)?|descarga)\b/.test(t))return null;
  const adj=(files||[]).map(f=>(f.nombre.split('.').pop()||'').toLowerCase());
  const adjExcel=adj.some(e=>['xlsx','xlsm','xls','csv'].includes(e));
  for(const [f,re] of Object.entries(FMT_DOC)) if(re.test(t)&&!adj.includes(f)&&!(f==='xlsx'&&adjExcel)) return f;
  if(/\barchivo\b|\.(py|js|css|json|sql|csv)\b/.test(t)) for(const [f,re] of Object.entries(FMT_COD)) if(re.test(t)&&!adj.includes(f)&&!(f==='csv'&&adjExcel)) return f;
  return null;
}
function intentoCrear(t){return /\b(crea|cr[eé]a(me)?|haz(me)?|genera(me)?|construye|desarrolla|programa|arma(me)?|dise[ñn]a|dame|escribe|necesito|quiero)\b[\s\S]{0,60}\b(app|aplicaci[oó]n|p[aá]gina|web|sitio|landing|script|programa|herramienta|juego|calculadora|sistema|bot|formulario|dashboard|plantilla|reporte|informe|c[oó]digo)\b/i.test(t||'')}
function convertirBloquesGrandes(resp,creacion){
  const minLineas=creacion?6:15,usados=new Set();
  return resp.replace(/```([\w+-]*)[ \t]*\n([\s\S]*?)```/g,(m,lang,cont)=>{
    let ext=EXT_LANG[(lang||'').toLowerCase()];
    if(!ext&&!lang&&/^\s*(<!doctype html|<html)/i.test(cont))ext='html';
    if(!ext||ext==='txt'||cont.split('\n').length<minLineas)return m;
    let nom=nombreAuto(ext,cont),k=2;while(usados.has(nom)){nom=nombreAuto(ext,cont).replace(/(\.\w+)$/,'_'+(k++)+'$1')}
    usados.add(nom);return '```archivo:'+nom+'\n'+cont.replace(/\n$/,'')+'\n```';
  });
}
function aplicarFallbackArchivo(msg,files,resp){
  if(/```archivo:/.test(resp))return resp;
  const f=formatoPedido(msg,files);
  if(f){
    if(EXT_BIN[f])return 'Aquí tienes tu archivo.\n\n```archivo:'+nombreAuto(f,resp)+'\n'+resp+'\n```';
    const m=resp.match(/```[\w+-]*\n([\s\S]*?)```/);
    if(m)return 'Aquí tienes tu archivo.\n\n```archivo:'+nombreAuto(f,m[1])+'\n'+m[1].replace(/\n$/,'')+'\n```';
  }
  return convertirBloquesGrandes(resp,intentoCrear(msg));
}
function notaBot(bot,texto){const c=bot&&bot.querySelector('.cuerpo');if(!c)return;const n=document.createElement('div');n.className='nota-bot';n.textContent=texto;c.appendChild(n);ajustarEspaciador(anclaEl)}
// Excel/CSV adjunto: dashboard o archivo corregido se generan solos según lo que pida el usuario
async function autoArchivosAdjuntos(files,msg,bot){
  const fx=files.find(f=>/\.(xlsx|xlsm|xls|csv)$/i.test(f.nombre));
  if(!fx||!msg)return;
  destinoDescarga=bot.querySelector('.cuerpo');
  try{
    if(/\b(dashboard|tablero|panel de control)\b/i.test(msg)){
      if(/\bzip\b/i.test(msg))await crearDashboardZip(fx);else await crearDashboard(fx);
    }else if(parecePeticionDeCambio(msg)){
      if((fx.size||0)>5*1048576){notaBot(bot,'El archivo pesa más de 5 MB: para no saturar el servidor gratuito no lo corrijo automáticamente. Divídelo en partes más pequeñas.');return}
      await procesarArchivo(fx,msg,true,bot);
    }
  }finally{destinoDescarga=null}
}
async function leerError(r,def){try{const d=await r.json();return d.error||def}catch(e){return def+' (HTTP '+r.status+'). En Render gratis suele ser por tiempo de espera o memoria.'}}
function adjuntarAnalisis(fd,a){if(a&&a.analisis)fd.append('analisis',new Blob([JSON.stringify(a.analisis)],{type:'application/json'}),'analisis.json')}
async function crearDashboard(a){
  try{
    const fd=new FormData();fd.append('file_id',a.id);adjuntarAnalisis(fd,a);
    const r=await api('/api/dashboard',{method:'POST',body:fd});
    if(!r.ok)throw new Error(await leerError(r,'No se pudo crear el dashboard'))
    descargarBlob(await r.blob(),a.nombre.replace(/\.[^.]+$/,'')+'_dashboard.html');
  }catch(e){alert('Dashboard: '+e.message)}
}
async function crearDashboardZip(a){
  try{
    const fd=new FormData();fd.append('file_id',a.id);adjuntarAnalisis(fd,a);
    const r=await api('/api/dashboard.zip',{method:'POST',body:fd});
    if(!r.ok)throw new Error(await leerError(r,'No se pudo crear el ZIP'))
    descargarBlob(await r.blob(),a.nombre.replace(/\.[^.]+$/,'')+'_dashboard.zip');
  }catch(e){alert('Dashboard ZIP: '+e.message)}
}
async function procesarArchivo(a,instruccion,auto,bot){
  try{
    const promptText=(instruccion||prompt('¿Qué quieres que TAMPY corrija o modifique en este archivo?','Ejemplo: elimina los registros duplicados y corrige los valores negativos en la columna COSTO.')||'').trim();
    if(!promptText)return;
    const fd=new FormData();fd.append('file_id',a.id);fd.append('instruccion',promptText);
    const r=await api('/api/archivo/procesar',{method:'POST',body:fd});
    if(!r.ok)throw new Error(await leerError(r,'No se pudo procesar el archivo'))
    descargarBlob(await r.blob(),a.nombre.replace(/\.[^.]+$/,'')+'_corregido'+(/\.csv$/i.test(a.nombre)?'.csv':/\.txt$/i.test(a.nombre)?'.txt':/\.json$/i.test(a.nombre)?'.json':/\.xlsm$/i.test(a.nombre)?'.xlsm':'.xlsx'));
  }catch(e){if(auto)notaBot(bot,'No pude generar el archivo corregido: '+e.message);else alert('Procesar archivo: '+e.message)}
}
function parecePeticionDeCambio(t){return /\b(corrige|corregir|arregla|arreglar|limpia|limpiar|elimina|eliminar|quita|quitar|reemplaza|reemplazar|cambia|cambiar|agrega|agregar|añade|añadir|completa|completar|filtra|filtrar|ordena|ordenar|convierte|convertir|separa|separar|devu[eé]lve|devu[eé]lveme)\b|\bsin\s+(duplicados|repetidos|vac[ií]os|negativos)\b/i.test(t||'')}
function descargarBlob(blob,nombre,mostrar=true){
  blob=new Blob([blob],{type:'application/octet-stream'}); // evita que iOS agregue .txt al nombre
  const u=URL.createObjectURL(blob);
  if(mostrar){
    const bots=chat.querySelectorAll('.msg.bot');const bot=destinoDescarga||(bots.length?bots[bots.length-1].querySelector('.cuerpo'):chat);
    const card=document.createElement('div');card.className='archivo-listo';
    card.innerHTML=`<span class="descarga-icon">${iconoArchivo(nombre)}</span><div class="meta"><b>${esc(nombre)}</b><small>${formatoBytes(blob.size)} • archivo listo</small></div>`;
    const b=document.createElement('button');b.className='descargar';b.type='button';b.textContent='⬇ Descargar';b.onclick=()=>{const a=document.createElement('a');a.href=u;a.download=nombre;a.click()};card.appendChild(b);bot.appendChild(card);bajar();ajustarEspaciador(anclaEl);
  } else { const a=document.createElement('a');a.href=u;a.download=nombre;a.click(); }
  setTimeout(()=>URL.revokeObjectURL(u),120000);
}


async function crearDashboardMulti(){
  const files=pendientes.filter(a=>a.tipo==='archivo'&&a.id&&/\.(xlsx|xlsm|xls|csv)$/i.test(a.nombre));
  if(files.length<2){alert('Adjunta al menos 2 Excel/CSV para crear un dashboard combinado.');return}
  const fd=new FormData(); files.forEach(a=>{if(a.analisis)adjuntarAnalisis(fd,a);else fd.append('file_ids',a.id)});
  const r=await api('/api/dashboard/multi',{method:'POST',body:fd});
  if(!r.ok){alert(await leerError(r,'No se pudo crear el dashboard multiarchivo.'));return}
  descargarBlob(await r.blob(),'TAMPY_dashboard_multiarchivo.html');
}
async function crearLanding(){
  const nombre=prompt('Nombre del negocio o cliente:','Mi negocio'); if(!nombre)return;
  const detalle=prompt('Describe la landing (servicio, secciones, colores, WhatsApp, ubicación, etc.):','Landing moderna para una empresa de servicios con Inicio, Nosotros, Servicios, testimonios y Contacto.'); if(!detalle)return;
  const estilo=prompt('Estilo visual:','moderno, elegante, premium y responsive');
  const r=await api('/api/landing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre,prompt:detalle,estilo})});
  if(!r.ok){alert(await leerError(r,'No se pudo generar la landing.'));return}
  descargarBlob(await r.blob(),nombre.replace(/[^A-Za-z0-9_-]/g,'_')+'_landing.html');
}

async function guardarConversacion(){if(!historial.length)return;try{const t=tituloDe(historial.find(m=>m.role==='user')?.content);const r=await api('/api/conversations',{method:'POST',headers:{'Content-Type':'application/json',...profileHeader()},body:JSON.stringify({id:conversationId,title:t,mensajes:historial})});if(r.ok)localStorage.setItem('tampy_conversation_id',conversationId);else console.warn('No se pudo guardar la conversación',await r.text())}catch(e){console.warn('No se pudo guardar la conversación:',e)}}
async function enviar(){
  if(ocupado)return;
  if(subiendo.length){alert('Espera a que termine de subir el archivo.');return}
  const msg=texto.value.trim(); if(!msg&&!pendientes.length)return;
  if(msg&&!pendientes.length&&(modoImagen||esPedidoImagen(msg))){await generarImagen(msg);return}
  const adj=pendientes.slice(); pendientes=[]; pintarPrevias();
  const imgs=adj.filter(a=>a.tipo==='imagen'),files=adj.filter(a=>a.tipo==='archivo');let body='';
  files.forEach(a=>body+=`[Archivo adjunto: ${a.nombre}]\n${a.texto}\n${a.truncado?'[...archivo recortado]\n':''}[Fin del archivo]\n\n`);
  body+=msg||(imgs.length?'Describe y analiza esta imagen.':'Analiza este archivo.');
  const content=imgs.length?[{type:'text',text:body},...imgs.map(a=>({type:'image_url',image_url:{url:a.dataUrl}}))]:body;
  const uEl=agregarUsuario(msg,adj);anclarMensaje(uEl);historial.push({role:'user',content});texto.value='';autoAltura();ocupado=true;btnEnviar.disabled=true;
  const w=agregarEscribiendo();
  try{const r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',...profileHeader()},body:JSON.stringify({mensajes:paraServidor(),conversation_id:conversationId})});let d={};try{d=await r.json()}catch(e){throw new Error('El servidor no devolvió una respuesta válida. HTTP '+r.status)}w.remove();if(!r.ok)throw new Error(d.error||('Error del servidor HTTP '+r.status));const resp=aplicarFallbackArchivo(msg,files,d.respuesta||'No recibí contenido de respuesta.');historial.push({role:'assistant',content:resp});const bot=agregarBot(resp);if(d.proveedor&&d.proveedor!=='groq')notaBot(bot,'Respondido con '+(NOMBRE_MOTOR[d.proveedor]||d.proveedor)+' porque Groq alcanzó su límite.');ajustarEspaciador(uEl);autoArchivosAdjuntos(files,msg,bot).catch(()=>{}); await guardarConversacion()}catch(e){w.remove();historial.pop();agregarBot('⚠️ '+e.message,true);ajustarEspaciador(uEl)}ocupado=false;btnEnviar.disabled=false;texto.focus();
}

// ================= Barra lateral, historial y borrado =================
function abrirDrawer(){document.body.classList.add('drawer-open');cargarConversaciones()}
function cerrarDrawer(){document.body.classList.remove('drawer-open')}
function nuevoDesdeDrawer(){nuevaConversacion();cerrarDrawer()}
function memoriaDesdeDrawer(){cerrarDrawer();abrirPanel('memoriaPanel')}
const ICONO_BASURA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>';
async function cargarConversaciones(){
  const box=$('drawerLista');if(!box)return;
  try{
    const r=await api('/api/conversations',{headers:profileHeader()});if(!r.ok)return;const d=await r.json();
    box.innerHTML='';
    d.conversaciones.forEach(c=>{
      const x=document.createElement('div');x.className='dr-conv'+(c.id===conversationId?' activa':'');
      const t=document.createElement('button');t.type='button';t.className='tit';t.textContent=c.title||'Conversación';t.onclick=()=>abrirConversacion(c.id);
      const del=document.createElement('button');del.type='button';del.className='del';del.setAttribute('aria-label','Borrar conversación');del.innerHTML=ICONO_BASURA;del.onclick=ev=>borrarConversacion(c.id,ev);
      x.appendChild(t);x.appendChild(del);box.appendChild(x);
    });
    if(!d.conversaciones.length)box.innerHTML='<div class="dr-vacio">Aún no hay conversaciones.</div>';
    $('btnBorrarTodo').style.display=d.conversaciones.length?'':'none';
  }catch(e){console.warn('No se pudo cargar el historial',e)}
}
async function borrarConversacion(id,ev){
  if(ev)ev.stopPropagation();
  if(!confirm('¿Borrar esta conversación? No se puede deshacer.'))return;
  const r=await api('/api/conversations/'+id,{method:'DELETE',headers:profileHeader()});
  if(!r.ok){alert('No se pudo borrar la conversación.');return}
  if(id===conversationId)nuevaConversacion();
  cargarConversaciones();
}
async function borrarTodoHistorial(){
  if(!confirm('¿Borrar TODO el historial de conversaciones? No se puede deshacer. Los recuerdos de la memoria se conservan.'))return;
  const r=await api('/api/conversations',{method:'DELETE',headers:profileHeader()});
  if(!r.ok){alert('No se pudo borrar el historial.');return}
  nuevaConversacion();cargarConversaciones();
}
function tituloDe(content){
  let t=Array.isArray(content)?content.filter(p=>p.type==='text').map(p=>p.text).join(' '):String(content||'');
  const archivos=[...t.matchAll(/\[Archivo adjunto: ([^\]]*)\]/g)].map(m=>m[1]);
  t=t.replace(/\[Archivo adjunto:[^\]]*\][\s\S]*?\[Fin del archivo\]\s*/g,'').replace(/\s+/g,' ').trim();
  if(!t&&archivos.length)t='📎 '+archivos[0];
  return (t||'Nueva conversación').slice(0,70);
}
function renderUsuarioGuardado(m){
  let t=m.content,adj=[];
  if(Array.isArray(t)){t.filter(p=>p.type==='image_url').forEach(p=>adj.push({tipo:'imagen',dataUrl:p.image_url.url}));t=t.filter(p=>p.type==='text').map(p=>p.text).join(' ')}
  t=String(t||'').replace(/\[Archivo adjunto: ([^\]]*)\]\n[\s\S]*?\[Fin del archivo\]\n*/g,(m0,n)=>{adj.push({tipo:'archivo',nombre:n});return ''}).trim();
  agregarUsuario(t,adj);
}

// ================= Imágenes =================
const NOMBRE_MOTOR={gemini:'Gemini',cerebras:'Cerebras',openrouter:'OpenRouter',mistral:'Mistral'};
function setModoImagen(v){modoImagen=!!v;const b=$('btnImagen');if(b)b.classList.toggle('activo',modoImagen);texto.placeholder=modoImagen?'Describe la imagen…':'Mensaje a TAMPY…';if(modoImagen)texto.focus()}
function esPedidoImagen(t){return /\b(genera(me)?|cr[eé]a(me)?|dibuja(me)?|haz(me)?|dise[ñn]a(me)?|ilustra(me)?|pinta(me)?|dame|necesito|quiero)\s+(?:\S+\s+){0,2}?(imagen|im[aá]genes|foto|fotograf[ií]a|ilustraci[oó]n|dibujo|logo|logotipo|p[oó]ster|poster|banner|wallpaper|fondo de pantalla|avatar|[ií]cono|icono|retrato)\b/i.test(t||'')}
function formatoImagen(t){t=(t||'').toLowerCase();if(/vertical|retrato|historia de instagram|story|p[oó]ster|poster|celular|portada de libro/.test(t))return 'vertical';if(/horizontal|banner|paisaje|wallpaper|fondo de pantalla|portada|youtube|panor[aá]mic/.test(t))return 'horizontal';return 'cuadrado'}
function slugear(s,n=40){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,n)}
function agregarBotImagen(blob,msg,motor){
  const url=URL.createObjectURL(blob),ext=(blob.type.split('/')[1]||'jpg').replace('jpeg','jpg');
  const div=document.createElement('div');div.className='msg bot';div.innerHTML=logoHTML();
  const c=document.createElement('div');c.className='cuerpo';
  const im=document.createElement('img');im.className='img-generada';im.src=url;im.alt=msg;c.appendChild(im);
  const fila=document.createElement('div');fila.className='img-acciones';
  const dl=document.createElement('button');dl.type='button';dl.className='btn-acc';dl.textContent='⬇ Descargar';dl.onclick=()=>descargarBlob(blob,'imagen_'+(slugear(msg)||'tampy')+'.'+ext,false);
  const otra=document.createElement('button');otra.type='button';otra.className='btn-sec';otra.textContent='🔄 Otra versión';otra.onclick=()=>{if(!ocupado)generarImagen(msg)};
  fila.appendChild(dl);fila.appendChild(otra);c.appendChild(fila);
  const n=document.createElement('div');n.className='nota-bot';n.textContent='Generada con '+(motor==='cloudflare'?'FLUX (Cloudflare)':'FLUX (Pollinations)')+'.';c.appendChild(n);
  div.appendChild(c);insertar(div);bajar();return div;
}
function tarjetaImagenGuardada(prompt){
  const d=document.createElement('div');
  const p=document.createElement('div');p.textContent='🖼️ Imagen generada: “'+prompt+'”';d.appendChild(p);
  const n=document.createElement('div');n.className='nota-bot';n.textContent='Las imágenes no se guardan en el historial.';d.appendChild(n);
  const b=document.createElement('button');b.type='button';b.className='btn-sec';b.style.marginTop='8px';b.textContent='🔄 Generar de nuevo';b.onclick=()=>{if(!ocupado)generarImagen(prompt)};d.appendChild(b);
  return d;
}
async function generarImagen(msg){
  const uEl=agregarUsuario(msg,[]);anclarMensaje(uEl);historial.push({role:'user',content:msg});
  texto.value='';autoAltura();ocupado=true;btnEnviar.disabled=true;setModoImagen(false);
  const w=agregarEscribiendo();w.querySelector('.cuerpo').insertAdjacentHTML('beforeend',' <span class="nota-bot">Generando imagen…</span>');
  try{
    const r=await api('/api/imagen',{method:'POST',headers:{'Content-Type':'application/json',...profileHeader()},body:JSON.stringify({prompt:msg,formato:formatoImagen(msg)})});
    if(!r.ok)throw new Error(await leerError(r,'No pude generar la imagen'));
    const blob=await r.blob(),motor=r.headers.get('X-Motor')||'';
    w.remove();agregarBotImagen(blob,msg,motor);
    historial.push({role:'assistant',content:'[[imagen:'+msg.replace(/\]\]/g,'')+']]'});
    ajustarEspaciador(uEl);await guardarConversacion();
  }catch(e){w.remove();historial.pop();agregarBot('⚠️ '+e.message,true);ajustarEspaciador(uEl)}
  ocupado=false;btnEnviar.disabled=false;texto.focus();
}
function paraServidor(){return historial.map(m=>{if(m.role==='assistant'&&typeof m.content==='string'){const mi=m.content.match(/^\[\[imagen:([\s\S]*)\]\]$/);if(mi)return {role:'assistant',content:'(Generé una imagen a partir de: "'+mi[1].slice(0,200)+'")'}}return m})}

async function abrirConversacion(id){const r=await api('/api/conversations/'+id,{headers:profileHeader()});if(!r.ok)return;const d=await r.json();anclado=false;conversationId=id;localStorage.setItem('tampy_conversation_id',id);historial=d.messages||[];chat.innerHTML='';historial.forEach(m=>m.role==='user'?renderUsuarioGuardado(m):agregarBot(m.content));cerrarDrawer();scroll.scrollTop=scroll.scrollHeight}
async function cargarMemorias(){const r=await api('/api/memories',{headers:profileHeader()});if(!r.ok)return;const d=await r.json();const box=$('listaMemorias');box.innerHTML='';d.memories.forEach(m=>{const x=document.createElement('div');x.className='mem-item';const s=document.createElement('span');s.textContent=m.content;const b=document.createElement('button');b.type='button';b.className='small-btn';b.textContent='Eliminar';b.onclick=async()=>{await api('/api/memories/'+m.id,{method:'DELETE',headers:profileHeader()});cargarMemorias()};x.appendChild(s);x.appendChild(b);box.appendChild(x)});if(!d.memories.length)box.innerHTML='<p style="color:var(--muted)">No hay recuerdos guardados.</p>'}
async function guardarMemoria(){const inp=$('nuevaMemoria'),v=inp.value.trim();if(!v)return;await api('/api/memories',{method:'POST',headers:{'Content-Type':'application/json',...profileHeader()},body:JSON.stringify({content:v,category:'usuario'})});inp.value='';cargarMemorias()}
async function exportar(text,fmt){const r=await api('/api/export',{method:'POST',headers:{'Content-Type':'application/json',...profileHeader()},body:JSON.stringify({text,format:fmt,name:'TAMPY_documento'})});if(!r.ok){const d=await r.json();alert(d.error||'No se pudo generar');return}const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`TAMPY_documento.${fmt}`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nuevaConversacion(){cerrarDrawer();modoImagen=false;if($('btnImagen'))setModoImagen(false);anclado=false;historial=[];pendientes=[];conversationId=safeUUID();try{localStorage.setItem('tampy_conversation_id',conversationId)}catch(e){}chat.innerHTML=`<div id="bienvenida"><svg><use href="#logoFull"></use></svg><div class="wordmark">TAMPI</div><h1>¿En qué te ayudo hoy?</h1><p>Escribe, sube una imagen o adjunta un documento.</p><div class="sugerencias"><button type="button" onclick="sugerir('Resume este documento en puntos clave')">Resumir un documento</button><button type="button" onclick="sugerir('Explícame qué hay en esta imagen')">Analizar una imagen</button><button type="button" onclick="sugerir('Ayúdame a redactar un correo profesional')">Redactar un correo</button><button type="button" onclick="sugerir('Revisa mi código y dime qué errores tiene')">Revisar código</button><button type="button" onclick="crearLanding()">🌐 Crear Landing Page</button><button type="button" onclick="crearDashboardMulti()">📊 Dashboard multi Excel</button></div></div>`}
function sugerir(t){texto.value=t;autoAltura();texto.focus()}function autoAltura(){texto.style.height='auto';texto.style.height=Math.min(texto.scrollHeight,200)+'px'}
async function cargarConversacionActual(){try{const id=localStorage.getItem('tampy_conversation_id');if(id){const r=await api('/api/conversations/'+id,{headers:profileHeader()});if(r.ok){const d=await r.json();historial=d.messages||[];chat.innerHTML='';historial.forEach(m=>m.role==='user'?agregarUsuario(typeof m.content==='string'?m.content:'',[]):agregarBot(m.content))}}}catch(e){console.warn('No se pudo cargar la conversación',e)}}
window.addEventListener('error',e=>console.error('TAMPY JS error:',e.error||e.message));
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initTampy); else initTampy();
</script>
