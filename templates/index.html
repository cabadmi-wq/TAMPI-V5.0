<style>
:root {
  --accent: #0b7f93;
  --accent-hover: #086476;
  --accent-soft: #e0f4f7;
  --on-accent: #ffffff;
  --bg: #f2f8f9;
  --glow: rgba(20, 160, 180, .14);
  --surface: #ffffff;
  --text: #0b1e24;
  --muted: #5b7a82;
  --border: #d3e6ea;
  --user-bg: #dcf0f3;
  --code-bg: #06232a;
  --shadow: 0 4px 24px rgba(8, 80, 95, .10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --accent: #2dd4ea;
    --accent-hover: #5fe0f1;
    --accent-soft: #0b3a45;
    --on-accent: #031a20;
    --bg: #031a20;
    --glow: rgba(20, 170, 190, .20);
    --surface: #082a32;
    --text: #e6f3f5;
    --muted: #82a5ad;
    --border: #134551;
    --user-bg: #0e4350;
    --code-bg: #01141a;
    --shadow: 0 4px 24px rgba(0, 0, 0, .40);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: radial-gradient(1100px 560px at 100% -8%, var(--glow), transparent 62%), var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(8px);
}
.marca { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: .2px; }
.marca svg { width: 34px; height: 34px; }
.btn-nuevo {
  background: transparent; color: var(--text); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer;
}
.btn-nuevo:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
.col { max-width: 760px; margin: 0 auto; padding: 24px 20px 12px; }

/* Pantalla de bienvenida */
#bienvenida { text-align: center; padding: 9vh 0 3vh; }
#bienvenida svg { width: 150px; height: 150px; filter: drop-shadow(0 10px 22px rgba(20, 190, 210, .35)); }
#bienvenida h1 {
  font-family: ui-serif, Georgia, "Times New Roman", serif;
  font-weight: 500; font-size: clamp(28px, 5vw, 38px); margin-top: 18px;
}
#bienvenida p { color: var(--muted); margin-top: 8px; }
.sugerencias { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 28px; }
.sugerencias button {
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 999px; padding: 9px 16px; font-size: 14px; cursor: pointer;
}
.sugerencias button:hover { border-color: var(--accent); color: var(--accent); }

/* Mensajes */
.msg { display: flex; gap: 14px; margin: 22px 0; animation: sube .25s ease; }
@keyframes sube { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.msg.user { justify-content: flex-end; }
.msg.user .cuerpo {
  background: var(--user-bg); border-radius: 18px 18px 4px 18px;
  padding: 12px 16px; max-width: 85%; white-space: pre-wrap; word-break: break-word;
}
.avatar { flex: none; width: 30px; height: 30px; margin-top: 2px; }
#espaciador { flex: none; pointer-events: none; }
header .marca { white-space: nowrap; min-width: 0; }
.marca svg { flex: none; }
.btn-nuevo { white-space: nowrap; }
@media (max-width: 480px) {
  header { padding: 10px 12px; gap: 6px; }
  .marca { gap: 8px; font-size: 16px; }
  #storageBadge { font-size: 10px !important; }
  .btn-nuevo { padding: 7px 9px; font-size: 13px; border-radius: 9px; }
  header > div:last-child { gap: 5px !important; }
}
@media (max-width: 440px) { #storageBadge { display: none; } }
.msg.bot .cuerpo { flex: 1; min-width: 0; line-height: 1.7; }
.cuerpo p { margin: 0 0 12px; }
.cuerpo p:last-child { margin-bottom: 0; }
.cuerpo ul, .cuerpo ol { margin: 0 0 12px 22px; }
.cuerpo li { margin: 4px 0; }
.cuerpo h1, .cuerpo h2, .cuerpo h3 { margin: 18px 0 8px; line-height: 1.3; }
.cuerpo a { color: var(--accent); }
.cuerpo code { background: var(--accent-soft); padding: 2px 6px; border-radius: 6px; font-size: .9em; }
.cuerpo pre {
  position: relative; background: var(--code-bg); color: #e6e9f2; border-radius: 12px;
  padding: 16px; overflow-x: auto; margin: 0 0 12px; font-size: 13.5px; line-height: 1.55;
}
.cuerpo pre code { background: none; padding: 0; color: inherit; }
.copiar {
  position: absolute; top: 8px; right: 8px; background: #0f3d47; color: #c9f4fa;
  border: 0; border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer;
}
.copiar:hover { background: var(--accent); color: var(--on-accent); }
.cuerpo table { border-collapse: collapse; margin: 0 0 12px; display: block; overflow-x: auto; }
.cuerpo th, .cuerpo td { border: 1px solid var(--border); padding: 7px 12px; }
.cuerpo th { background: var(--accent-soft); }
.cuerpo blockquote { border-left: 3px solid var(--accent); padding-left: 14px; color: var(--muted); margin: 0 0 12px; }
.error { color: #d92d20; }

.adjuntos-msg { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; justify-content: flex-end; }
.adjuntos-msg img { max-height: 140px; max-width: 220px; border-radius: 12px; object-fit: cover; }

.puntos { display: inline-flex; gap: 5px; padding: 10px 0; }
.puntos i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: rebote 1.1s infinite; }
.puntos i:nth-child(2) { animation-delay: .15s; }
.puntos i:nth-child(3) { animation-delay: .3s; }
@keyframes rebote { 0%, 60%, 100% { opacity: .25; transform: none; } 30% { opacity: 1; transform: translateY(-4px); } }

/* Barra de escritura */
footer { padding: 0 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.caja {
  max-width: 760px; margin: 0 auto; background: var(--surface);
  border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow);
  padding: 10px 10px 10px 12px; transition: border-color .15s, box-shadow .15s;
}
.caja:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent), var(--shadow); }
.caja.arrastrando { border-color: var(--accent); background: var(--accent-soft); }
#previas { display:flex; flex-wrap:wrap; gap:10px; padding:4px 2px 10px; max-height:210px; overflow:auto; }
#previas:empty { display:none; }
.previa { position:relative; width:112px; min-height:94px; border:1px solid var(--border); background:var(--surface); border-radius:14px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.previa.imagen { width:112px; height:112px; }
.previa .miniatura { width:100%; height:72px; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); overflow:hidden; }
.previa.imagen .miniatura { height:100%; }
.previa img { width:100%; height:100%; object-fit:cover; cursor:zoom-in; }
.previa .archivo-icono { font-size:31px; }
.previa .nombre { display:block; padding:6px 24px 6px 8px; font-size:11px; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.previa .tipo { display:block; padding:0 8px 7px; color:var(--muted); font-size:10px; }
.previa .quitar { position:absolute; top:5px; right:5px; width:24px; height:24px; border:0; border-radius:50%; background:rgba(20,20,25,.72); color:#fff; cursor:pointer; font-size:15px; line-height:24px; padding:0; z-index:3; }
.previa .quitar:hover { background:#d92d20; }
.adjuntos-contador { width:100%; color:var(--muted); font-size:11px; padding:0 3px 2px; }
.archivo-listo { display:flex; align-items:center; gap:10px; padding:10px 12px; margin-top:8px; border:1px solid var(--border); border-radius:12px; background:var(--accent-soft); }
.archivo-listo .descarga-icon { font-size:24px; }
.archivo-listo .meta { flex:1; min-width:0; }
.archivo-listo .meta b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.archivo-listo .meta small { color:var(--muted); }
.archivo-listo .descargar { border:0; border-radius:9px; padding:7px 10px; background:var(--accent); color:var(--on-accent); cursor:pointer; font-weight:600; }
.archivo-listo .descargar:hover { filter:brightness(.94); }
.fila { display: flex; align-items: flex-end; gap: 6px; }
.copiar.bajar { right: 70px; }
.tarjeta-adj { display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px 12px; text-align:left; max-width:260px; }
.tarjeta-adj .ic { font-size:24px; }
.tarjeta-adj .nm { display:block; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px; }
.tarjeta-adj small { color:var(--muted); font-size:11px; }
.previa.subiendo { display:flex; align-items:center; justify-content:center; min-height:94px; color:var(--muted); font-size:11px; padding:8px; text-align:center; }
textarea {
  flex: 1; background: transparent; border: 0; outline: 0; resize: none; color: var(--text);
  font: inherit; font-size: 16px; line-height: 1.5; max-height: 200px; padding: 8px 4px;
}
textarea::placeholder { color: var(--muted); }
.icono {
  flex: none; width: 38px; height: 38px; border-radius: 12px; border: 0; cursor: pointer;
  display: grid; place-items: center; background: transparent; color: var(--muted);
}
.icono:hover { background: var(--accent-soft); color: var(--accent); }
.icono svg { width: 20px; height: 20px; }
#enviar { background: var(--accent); color: var(--on-accent); border-radius: 50%; }
#enviar:hover { background: var(--accent-hover); color: var(--on-accent); }
#enviar:disabled { opacity: .4; cursor: not-allowed; }
.pie { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }

.panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;padding:20px}.panel.show{display:block}.panel-box{max-width:720px;max-height:80vh;overflow:auto;margin:7vh auto;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel-head button{border:0;background:transparent;color:var(--text);font-size:25px;cursor:pointer}.conv-item,.mem-item{padding:11px;border:1px solid var(--border);border-radius:12px;margin:8px 0;cursor:pointer}.conv-item:hover{border-color:var(--accent)}.mem-item{display:flex;justify-content:space-between;gap:10px;cursor:default}.small-btn{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:8px;padding:5px 8px;cursor:pointer}.exportes{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.exportes button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:12px}.exportes button:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>

<div class="panel" id="memoriaPanel"><div class="panel-box"><div class="panel-head"><b>🧠 Memoria de TAMPY</b><button onclick="cerrarPanel('memoriaPanel')">×</button></div><p style="color:var(--muted);font-size:13px;margin-bottom:12px">Puedes decir <b>“Recuerda que…”</b> durante una conversación o añadir recuerdos aquí.</p><div style="display:flex;gap:8px;margin-bottom:14px"><input id="nuevaMemoria" placeholder="Ej.: Mi proyecto se llama TAMPY" style="flex:1;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)"><button class="btn-nuevo" onclick="guardarMemoria()">Guardar</button></div><div id="listaMemorias"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const REQUIERE_CLAVE = {{ 'true' if requiere_clave else 'false' }};
const STORAGE_MODE = {{ storage|tojson }};
const $ = id => document.getElementById(id);
const safeUUID = () => (window.crypto && typeof window.crypto.randomUUID === 'function') ? window.crypto.randomUUID() : ('id-' + Date.now() + '-' + Math.random().toString(16).slice(2));

let historial = [], pendientes = [], subiendo = [], ocupado = false, conversationId = null;
let anclado = false, espaciador = null;
let chat, scroll, texto, btnEnviar, previas, caja, inputArchivo;

function initTampy(){
  chat=$('chat'); scroll=$('scroll'); texto=$('texto'); btnEnviar=$('enviar'); previas=$('previas'); caja=$('caja'); inputArchivo=$('archivo');
  if(!chat || !scroll || !texto || !btnEnviar){ console.error('TAMPY: faltan elementos del chat'); return; }
  try {
    if(!localStorage.getItem('tampy_profile')) localStorage.setItem('tampy_profile', safeUUID());
    conversationId=localStorage.getItem('tampy_conversation_id') || safeUUID();
  } catch(e) { conversationId=safeUUID(); console.warn('TAMPY localStorage no disponible',e); }
  const badge=$('storageBadge'); if(badge) badge.textContent=STORAGE_MODE==='postgres'?'☁ nube':'💻 local';
  inputArchivo.addEventListener('change',async e=>{await procesarArchivos([...e.target.files]);inputArchivo.value=''});
  texto.addEventListener('paste',async e=>{const imgs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));if(imgs.length){e.preventDefault();await procesarArchivos(imgs)}});
  ['dragenter','dragover'].forEach(ev=>caja.addEventListener(ev,e=>{e.preventDefault();caja.classList.add('arrastrando')}));
  ['dragleave','drop'].forEach(ev=>caja.addEventListener(ev,e=>{e.preventDefault();caja.classList.remove('arrastrando')}));
  caja.addEventListener('drop',e=>procesarArchivos([...e.dataTransfer.files]));
  texto.addEventListener('input',autoAltura);
  texto.addEventListener('keydown',e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); e.stopPropagation(); enviar(); }
  });
  btnEnviar.addEventListener('click',e=>{e.preventDefault(); enviar();});
  cargarConversacionActual();
}

function logoHTML(){return '<svg class="avatar"><use href="#logo"></use></svg>'}
function bajar(){if(anclado)return;scroll.scrollTop=scroll.scrollHeight}
function insertar(el){if(espaciador&&espaciador.parentNode===chat)chat.insertBefore(el,espaciador);else chat.appendChild(el)}
function ajustarEspaciador(el){
  if(!espaciador||!el||espaciador.parentNode!==chat)return;
  espaciador.style.height='0px';
  const usado=espaciador.getBoundingClientRect().top-el.getBoundingClientRect().top;
  espaciador.style.height=Math.max(0,scroll.clientHeight-usado-16)+'px';
}
function anclarMensaje(el){
  anclado=true;
  if(!espaciador){espaciador=document.createElement('div');espaciador.id='espaciador'}
  chat.appendChild(espaciador);
  ajustarEspaciador(el);
  const top=scroll.scrollTop+el.getBoundingClientRect().top-scroll.getBoundingClientRect().top-12;
  scroll.scrollTo({top:Math.max(0,top),behavior:'smooth'});
}
function abrirPanel(id){$(id).classList.add('show'); if(id==='historialPanel') cargarConversaciones(); if(id==='memoriaPanel') cargarMemorias()}
function cerrarPanel(id){$(id).classList.remove('show')}
function renderMarkdown(md){
  if(window.marked && window.DOMPurify){
    const html=DOMPurify.sanitize(marked.parse(md,{breaks:true}));
    const cont=document.createElement('div');cont.innerHTML=html;
    cont.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});
    cont.querySelectorAll('pre').forEach(pre=>{const cod=pre.querySelector('code');const b=document.createElement('button');b.type='button';b.className='copiar';b.textContent='Copiar';b.onclick=()=>{navigator.clipboard?.writeText((cod||pre).textContent.trim());b.textContent='¡Copiado!';setTimeout(()=>b.textContent='Copiar',1500)};pre.appendChild(b);const d=document.createElement('button');d.type='button';d.className='copiar bajar';d.textContent='⬇ Descargar';d.onclick=()=>{const i=infoCodigo(cod);descargarBlob(new Blob([(cod||pre).textContent],{type:'text/plain;charset=utf-8'}),i.nombre,false)};pre.appendChild(d)});return cont;
  }
  const cont=document.createElement('div');cont.style.whiteSpace='pre-wrap';cont.textContent=md;return cont;
}
const EXT_LANG={html:'html',xml:'xml',css:'css',javascript:'js',js:'js',typescript:'ts',ts:'ts',python:'py',py:'py',json:'json',csv:'csv',sql:'sql',bash:'sh',sh:'sh',shell:'sh',yaml:'yaml',yml:'yml',markdown:'md',md:'md',java:'java',c:'c',cpp:'cpp',csharp:'cs',cs:'cs',php:'php',ruby:'rb',go:'go',rust:'rs',text:'txt',txt:'txt',plaintext:'txt'};
function infoCodigo(cod){
  const cls=[...(cod&&cod.classList||[])].find(c=>c.startsWith('language-'));const lang=cls?cls.slice(9):'';
  if(lang.toLowerCase().startsWith('archivo:')){const n=lang.slice(8).replace(/[^\w.\-]/g,'_');if(n)return {nombre:n}}
  return {nombre:'tampy_codigo.'+(EXT_LANG[lang.toLowerCase()]||'txt')};
}
function quitarBienvenida(){const b=$('bienvenida');if(b)b.remove()}
function agregarUsuario(t,adj){quitarBienvenida();const div=document.createElement('div');div.className='msg user';const c=document.createElement('div');c.className='cuerpo';if(adj.length){const f=document.createElement('div');f.className='adjuntos-msg';adj.forEach(a=>{if(a.tipo==='imagen'){const im=document.createElement('img');im.src=a.dataUrl;f.appendChild(im)}else{const x=document.createElement('div');x.className='tarjeta-adj';x.innerHTML='<span class="ic">'+iconoArchivo(a.nombre)+'</span><div><span class="nm">'+esc(a.nombre)+'</span><small>'+esc((a.analisis&&a.analisis.tipo||a.nombre.split('.').pop()||'archivo').toUpperCase()+(a.size?' • '+formatoBytes(a.size):''))+'</small></div>';f.appendChild(x)}});c.appendChild(f)}if(t)c.appendChild(document.createTextNode(t));div.appendChild(c);insertar(div);bajar();return div}
function agregarBot(contenido,esError=false){const div=document.createElement('div');div.className='msg bot';div.innerHTML=logoHTML();const c=document.createElement('div');c.className='cuerpo'+(esError?' error':'');if(esError)c.textContent=contenido;else{c.appendChild(renderMarkdown(contenido));const ex=document.createElement('div');ex.className='exportes';[['txt','TXT'],['docx','Word'],['pdf','PDF'],['xlsx','Excel'],['pptx','PowerPoint'],['html','HTML']].forEach(([f,l])=>{const b=document.createElement('button');b.type='button';b.textContent='⬇ '+l;b.onclick=()=>exportar(contenido,f);ex.appendChild(b)});c.appendChild(ex)}div.appendChild(c);insertar(div);bajar();return div}
function agregarEscribiendo(){const d=document.createElement('div');d.className='msg bot';d.innerHTML=logoHTML()+'<div class="cuerpo"><span class="puntos"><i></i><i></i><i></i></span></div>';insertar(d);bajar();return d}
async function api(url,opt={}){opt.headers=Object.assign({},opt.headers||{});try{const clave=sessionStorage.getItem('tampy_clave');if(clave)opt.headers['X-Clave']=clave}catch(e){}let r=await fetch(url,opt);if(r.status===401&&REQUIERE_CLAVE){const n=prompt('Clave de acceso de TAMPY:');if(!n)return r;sessionStorage.setItem('tampy_clave',n);opt.headers['X-Clave']=n;r=await fetch(url,opt)}return r}
function profileHeader(){let p='public';try{p=localStorage.getItem('tampy_profile')||p}catch(e){}return {'X-Tampy-Profile':p}}
function redimensionarImagen(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const M=1568,s=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85))};im.onerror=()=>rej(new Error('No pude abrir '+file.name));im.src=u})}
async function procesarArchivos(lista){for(const file of lista){if(pendientes.length>=10){alert('Máximo 10 archivos o imágenes por mensaje.');break}try{if(file.type.startsWith('image/')){pendientes.push({tipo:'imagen',nombre:file.name||'imagen.jpg',size:file.size,dataUrl:await redimensionarImagen(file)})}else{subiendo.push(file.name);pintarPrevias();const fd=new FormData();fd.append('archivo',file);let r,d;try{r=await api('/api/archivo',{method:'POST',body:fd});try{d=await r.json()}catch(_){d={error:r.status===413?'El archivo supera el límite de 100 MB.':'El servidor no pudo procesar el archivo (HTTP '+r.status+'). En Render gratis suele ser por tamaño o por tiempo de espera.'}}}finally{subiendo.splice(subiendo.indexOf(file.name),1)}if(!r.ok)throw new Error(d.error);pendientes.push({tipo:'archivo',id:d.id,nombre:d.nombre,size:file.size,texto:d.texto,truncado:d.truncado,analisis:d.analisis})}}catch(e){alert(e.message)}}pintarPrevias()}
function iconoArchivo(nombre){const e=(nombre.split('.').pop()||'').toLowerCase();return ({xlsx:'📊',xlsm:'📊',xls:'📊',csv:'📊',pdf:'📕',docx:'📘',pptx:'📙',txt:'📄',md:'📝',json:'🧾',js:'🟨',py:'🐍',html:'🌐',css:'🎨'}[e]||'📎')}
function formatoBytes(n){if(!n)return '';if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
function pintarPrevias(){
  previas.innerHTML='';
  subiendo.forEach(n=>{const u=document.createElement('div');u.className='previa subiendo';u.textContent='⏳ Subiendo '+n+'...';previas.appendChild(u)});
  if(!pendientes.length)return;
  const contador=document.createElement('div');contador.className='adjuntos-contador';contador.textContent=`${pendientes.length} archivo${pendientes.length===1?'':'s'} preparado${pendientes.length===1?'':'s'} para enviar`;previas.appendChild(contador);
  pendientes.forEach((a,i)=>{
    const c=document.createElement('div');c.className='previa '+(a.tipo==='imagen'?'imagen':'archivo');
    const q=document.createElement('button');q.type='button';q.className='quitar';q.title='Quitar';q.textContent='×';q.onclick=()=>{pendientes.splice(i,1);pintarPrevias()};c.appendChild(q);
    const m=document.createElement('div');m.className='miniatura';
    if(a.tipo==='imagen'){const im=document.createElement('img');im.src=a.dataUrl;im.alt=a.nombre;im.title='Ver imagen';im.onclick=()=>abrirImagenPrevia(a.dataUrl,a.nombre);m.appendChild(im)}
    else {const ic=document.createElement('span');ic.className='archivo-icono';ic.textContent=iconoArchivo(a.nombre);m.appendChild(ic)}
    c.appendChild(m);
    const n=document.createElement('span');n.className='nombre';n.title=a.nombre;n.textContent=a.nombre;c.appendChild(n);
    if(a.tipo==='archivo'){const t=document.createElement('span');t.className='tipo';t.textContent=(a.analisis?.tipo||a.nombre.split('.').pop()||'archivo').toUpperCase()+(a.size?' • '+formatoBytes(a.size):'');c.appendChild(t)}
    previas.appendChild(c);
  });
}
function abrirImagenPrevia(src,nombre){
  let modal=document.getElementById('modalImagenTampy');
  if(!modal){modal=document.createElement('div');modal.id='modalImagenTampy';modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;cursor:zoom-out';modal.onclick=()=>modal.remove();document.body.appendChild(modal)}
  modal.innerHTML=`<img src="${src}" alt="${esc(nombre)}" style="max-width:96vw;max-height:90vh;border-radius:16px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.4)">`;
}
async function leerError(r,def){try{const d=await r.json();return d.error||def}catch(e){return def+' (HTTP '+r.status+'). En Render gratis suele ser por tiempo de espera o memoria.'}}
function adjuntarAnalisis(fd,a){if(a&&a.analisis)fd.append('analisis',new Blob([JSON.stringify(a.analisis)],{type:'application/json'}),'analisis.json')}
async function crearDashboard(a){
  try{
    const fd=new FormData();fd.append('file_id',a.id);adjuntarAnalisis(fd,a);
    const r=await api('/api/dashboard',{method:'POST',body:fd});
    if(!r.ok)throw new Error(await leerError(r,'No se pudo crear el dashboard'))
    descargarBlob(await r.blob(),a.nombre.replace(/\.[^.]+$/,'')+'_dashboard.html');
  }catch(e){alert('Dashboard: '+e.message)}
}
async function crearDashboardZip(a){
  try{
    const fd=new FormData();fd.append('file_id',a.id);adjuntarAnalisis(fd,a);
    const r=await api('/api/dashboard.zip',{method:'POST',body:fd});
    if(!r.ok)throw new Error(await leerError(r,'No se pudo crear el ZIP'))
    descargarBlob(await r.blob(),a.nombre.replace(/\.[^.]+$/,'')+'_dashboard.zip');
  }catch(e){alert('Dashboard ZIP: '+e.message)}
}
async function procesarArchivo(a,instruccion){
  try{
    const promptText=(instruccion||prompt('¿Qué quieres que TAMPY corrija o modifique en este archivo?','Ejemplo: elimina los registros duplicados y corrige los valores negativos en la columna COSTO.')||'').trim();
    if(!promptText)return;
    const fd=new FormData();fd.append('file_id',a.id);fd.append('instruccion',promptText);
    const r=await api('/api/archivo/procesar',{method:'POST',body:fd});
    if(!r.ok)throw new Error(await leerError(r,'No se pudo procesar el archivo'))
    descargarBlob(await r.blob(),a.nombre.replace(/\.[^.]+$/,'')+'_corregido'+(/\.csv$/i.test(a.nombre)?'.csv':/\.txt$/i.test(a.nombre)?'.txt':/\.json$/i.test(a.nombre)?'.json':'.xlsx'));
  }catch(e){alert('Procesar archivo: '+e.message)}
}
function parecePeticionDeCambio(t){return /\b(corrige|corregir|arregla|arreglar|limpia|limpiar|elimina|eliminar|quita|quitar|reemplaza|reemplazar|cambia|cambiar|agrega|agregar|añade|añadir|completa|completar|filtra|filtrar|ordena|ordenar|convierte|convertir|separa|separar)\b/i.test(t||'')}
function descargarBlob(blob,nombre,mostrar=true){
  const u=URL.createObjectURL(blob);
  if(mostrar){
    const bot=chat.querySelector('.msg.bot:last-child .cuerpo') || chat;
    const card=document.createElement('div');card.className='archivo-listo';
    card.innerHTML=`<span class="descarga-icon">📦</span><div class="meta"><b>${esc(nombre)}</b><small>${formatoBytes(blob.size)} • archivo listo</small></div>`;
    const b=document.createElement('button');b.className='descargar';b.type='button';b.textContent='⬇ Descargar';b.onclick=()=>{const a=document.createElement('a');a.href=u;a.download=nombre;a.click()};card.appendChild(b);bot.appendChild(card);bajar();
  } else { const a=document.createElement('a');a.href=u;a.download=nombre;a.click(); }
  setTimeout(()=>URL.revokeObjectURL(u),120000);
}


async function crearDashboardMulti(){
  const files=pendientes.filter(a=>a.tipo==='archivo'&&a.id&&/\.(xlsx|xlsm|xls|csv)$/i.test(a.nombre));
  if(files.length<2){alert('Adjunta al menos 2 Excel/CSV para crear un dashboard combinado.');return}
  const fd=new FormData(); files.forEach(a=>{if(a.analisis)adjuntarAnalisis(fd,a);else fd.append('file_ids',a.id)});
  const r=await api('/api/dashboard/multi',{method:'POST',body:fd});
  if(!r.ok){alert(await leerError(r,'No se pudo crear el dashboard multiarchivo.'));return}
  descargarBlob(await r.blob(),'TAMPY_dashboard_multiarchivo.html');
}
async function crearLanding(){
  const nombre=prompt('Nombre del negocio o cliente:','Mi negocio'); if(!nombre)return;
  const detalle=prompt('Describe la landing (servicio, secciones, colores, WhatsApp, ubicación, etc.):','Landing moderna para una empresa de servicios con Inicio, Nosotros, Servicios, testimonios y Contacto.'); if(!detalle)return;
  const estilo=prompt('Estilo visual:','moderno, elegante, premium y responsive');
  const r=await api('/api/landing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre,prompt:detalle,estilo})});
  if(!r.ok){alert(await leerError(r,'No se pudo generar la landing.'));return}
  descargarBlob(await r.blob(),nombre.replace(/[^A-Za-z0-9_-]/g,'_')+'_landing.html');
}

async function guardarConversacion(){if(!historial.length)return;try{const title=(historial.find(m=>m.role==='user')?.content||'Nueva conversación');const t=typeof title==='string'?title.replace(/\s+/g,' ').slice(0,70):'Conversación';const r=await api('/api/conversations',{method:'POST',headers:{'Content-Type':'application/json',...profileHeader()},body:JSON.stringify({id:conversationId,title:t,mensajes:historial})});if(r.ok)localStorage.setItem('tampy_conversation_id',conversationId);else console.warn('No se pudo guardar la conversación',await r.text())}catch(e){console.warn('No se pudo guardar la conversación:',e)}}
async function enviar(){
  if(ocupado)return;
  if(subiendo.length){alert('Espera a que termine de subir el archivo.');return}
  const msg=texto.value.trim(); if(!msg&&!pendientes.length)return;
  const adj=pendientes.slice(); pendientes=[]; pintarPrevias();
  const imgs=adj.filter(a=>a.tipo==='imagen'),files=adj.filter(a=>a.tipo==='archivo');let body='';
  files.forEach(a=>body+=`[Archivo adjunto: ${a.nombre}]\n${a.texto}\n${a.truncado?'[...archivo recortado]\n':''}[Fin del archivo]\n\n`);
  body+=msg||(imgs.length?'Describe y analiza esta imagen.':'Analiza este archivo.');
  const content=imgs.length?[{type:'text',text:body},...imgs.map(a=>({type:'image_url',image_url:{url:a.dataUrl}}))]:body;
  const uEl=agregarUsuario(msg,adj);anclarMensaje(uEl);historial.push({role:'user',content});texto.value='';autoAltura();ocupado=true;btnEnviar.disabled=true;
  const w=agregarEscribiendo();
  try{const r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',...profileHeader()},body:JSON.stringify({mensajes:historial})});let d={};try{d=await r.json()}catch(e){throw new Error('El servidor no devolvió una respuesta válida. HTTP '+r.status)}w.remove();if(!r.ok)throw new Error(d.error||('Error del servidor HTTP '+r.status));historial.push({role:'assistant',content:d.respuesta||'No recibí contenido de respuesta.'});const bot=agregarBot(d.respuesta||'No recibí contenido de respuesta.');ajustarEspaciador(uEl); if(files.some(f=>f.nombre.toLowerCase().match(/\.(xlsx|xlsm|xls|csv)$/))){ const fx=files.find(f=>f.nombre.toLowerCase().match(/\.(xlsx|xlsm|xls|csv)$/)); const fb=bot.querySelector('.exportes'); const bp=document.createElement('button'); bp.type='button'; bp.textContent='🛠 Descargar archivo corregido'; bp.onclick=()=>procesarArchivo(fx,msg); fb.appendChild(bp); const b=document.createElement('button'); b.type='button'; b.textContent='📊 Dashboard HTML'; b.onclick=()=>crearDashboard(fx); fb.appendChild(b); const bz=document.createElement('button'); bz.type='button'; bz.textContent='📦 Dashboard ZIP'; bz.onclick=()=>crearDashboardZip(fx); fb.appendChild(bz); } await guardarConversacion()}catch(e){w.remove();historial.pop();agregarBot('⚠️ '+e.message,true);ajustarEspaciador(uEl)}ocupado=false;btnEnviar.disabled=false;texto.focus();
}
async function cargarConversaciones(){const r=await api('/api/conversations',{headers:profileHeader()});if(!r.ok)return;const d=await r.json();const box=$('listaConversaciones');box.innerHTML='';d.conversaciones.forEach(c=>{const x=document.createElement('div');x.className='conv-item';x.innerHTML=`<b>${esc(c.title)}</b><div style="font-size:11px;color:var(--muted);margin-top:4px">${new Date(c.updated_at).toLocaleString()}</div>`;x.onclick=()=>abrirConversacion(c.id);box.appendChild(x)});if(!d.conversaciones.length)box.innerHTML='<p style="color:var(--muted)">Aún no hay conversaciones guardadas.</p>'}
async function abrirConversacion(id){const r=await api('/api/conversations/'+id,{headers:profileHeader()});if(!r.ok)return;const d=await r.json();anclado=false;conversationId=id;localStorage.setItem('tampy_conversation_id',id);historial=d.messages||[];chat.innerHTML='';historial.forEach(m=>m.role==='user'?agregarUsuario(typeof m.content==='string'?m.content:'',[]):agregarBot(m.content));cerrarPanel('historialPanel')}
async function cargarMemorias(){const r=await api('/api/memories',{headers:profileHeader()});if(!r.ok)return;const d=await r.json();const box=$('listaMemorias');box.innerHTML='';d.memories.forEach(m=>{const x=document.createElement('div');x.className='mem-item';const s=document.createElement('span');s.textContent=m.content;const b=document.createElement('button');b.type='button';b.className='small-btn';b.textContent='Eliminar';b.onclick=async()=>{await api('/api/memories/'+m.id,{method:'DELETE',headers:profileHeader()});cargarMemorias()};x.appendChild(s);x.appendChild(b);box.appendChild(x)});if(!d.memories.length)box.innerHTML='<p style="color:var(--muted)">No hay recuerdos guardados.</p>'}
async function guardarMemoria(){const inp=$('nuevaMemoria'),v=inp.value.trim();if(!v)return;await api('/api/memories',{method:'POST',headers:{'Content-Type':'application/json',...profileHeader()},body:JSON.stringify({content:v,category:'usuario'})});inp.value='';cargarMemorias()}
async function exportar(text,fmt){const r=await api('/api/export',{method:'POST',headers:{'Content-Type':'application/json',...profileHeader()},body:JSON.stringify({text,format:fmt,name:'TAMPY_documento'})});if(!r.ok){const d=await r.json();alert(d.error||'No se pudo generar');return}const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`TAMPY_documento.${fmt}`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nuevaConversacion(){anclado=false;historial=[];pendientes=[];conversationId=safeUUID();try{localStorage.setItem('tampy_conversation_id',conversationId)}catch(e){}chat.innerHTML=`<div id="bienvenida"><svg><use href="#logoFull"></use></svg><h1>¿En qué te ayudo hoy?</h1><p>Escribe, sube una imagen o adjunta un documento.</p><div class="sugerencias"><button type="button" onclick="sugerir('Resume este documento en puntos clave')">Resumir un documento</button><button type="button" onclick="sugerir('Explícame qué hay en esta imagen')">Analizar una imagen</button><button type="button" onclick="sugerir('Ayúdame a redactar un correo profesional')">Redactar un correo</button><button type="button" onclick="sugerir('Revisa mi código y dime qué errores tiene')">Revisar código</button><button type="button" onclick="crearLanding()">🌐 Crear Landing Page</button><button type="button" onclick="crearDashboardMulti()">📊 Dashboard multi Excel</button></div></div>`}
function sugerir(t){texto.value=t;autoAltura();texto.focus()}function autoAltura(){texto.style.height='auto';texto.style.height=Math.min(texto.scrollHeight,200)+'px'}
async function cargarConversacionActual(){try{const id=localStorage.getItem('tampy_conversation_id');if(id){const r=await api('/api/conversations/'+id,{headers:profileHeader()});if(r.ok){const d=await r.json();historial=d.messages||[];chat.innerHTML='';historial.forEach(m=>m.role==='user'?agregarUsuario(typeof m.content==='string'?m.content:'',[]):agregarBot(m.content))}}}catch(e){console.warn('No se pudo cargar la conversación',e)}}
window.addEventListener('error',e=>console.error('TAMPY JS error:',e.error||e.message));
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initTampy); else initTampy();
</script>
